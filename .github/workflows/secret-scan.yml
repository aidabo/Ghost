name: Secret Scan

# 秘密鍵・API キー・AWS アクセスキーなどの誤コミットを止める番人。
# PR と main への push で「そのとき増えたコミットだけ」を gitleaks で見る。
# 全履歴ではなく差分範囲だけを対象にする（既存ファイルの定数で鳴り続けないため）。
#
# 注意: このリポの既存コミット済みファイル（minified bundle 等）には generic-api-key の
# 誤検出が出うる。差分スキャンなので既存分は対象外。もし誤検出が出たら、そのパスを
# gitleaks の allowlist（.gitleaks.toml）へ加える。

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # base..head の範囲を解決するため全履歴が要る。
          fetch-depth: 0

      - name: Install gitleaks (バージョン + SHA256 固定)
        run: |
          set -euo pipefail
          # 可変タグは使わない。走るバイナリを固定し、落としたものを検証する。更新は手で上げる。
          VERSION=8.30.1
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Scan changed commits
        env:
          # GitHub の値は run: に直書きせず env 経由で渡す（インジェクション面を作らない）。
          # ここで使うのは SHA（hex）だけで ref 名などの自由文字列は使わない。
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
            HEAD="$PR_HEAD"
          else
            BASE="$PUSH_BEFORE"
            HEAD="$PUSH_SHA"
          fi
          # 新規ブランチや force-push で before が全ゼロのときは HEAD の1本だけ見る。
          ZERO=0000000000000000000000000000000000000000
          if [ -z "$BASE" ] || [ "$BASE" = "$ZERO" ]; then
            LOG_OPTS="-1 $HEAD"
          else
            LOG_OPTS="$BASE..$HEAD"
          fi
          echo "scanning range: $LOG_OPTS"
          # --redact: 見つけても秘密の値そのものはログに出さない（規則名と場所だけ出る）。
          # 既定の規則で AWS キー・汎用 API キー・秘密鍵などを検出。見つかれば exit 1 で落ちる。
          ./gitleaks git --redact --no-banner --log-opts="$LOG_OPTS" .
